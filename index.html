<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reference Gallery</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery a {
      display: block;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
    }

    .gallery img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 8px 10px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Reference Gallery</h1>

  <div class="gallery">
    <a href="images/a001.jpg">
      <img src="images/a001.jpg" alt="a001">
      <div class="caption">a001</div>
    </a>

    <a href="images/a002.jpg">
      <img src="images/a002.jpg" alt="a002">
      <div class="caption">a002</div>
    </a>

    <a href="images/a003.jpg">
      <img src="images/a003.jpg" alt="a003">
      <div class="caption">a003</div>
    </a>

    <a href="images/a004.jpg">
      <img src="images/a004.jpg" alt="a004">
      <div class="caption">a004</div>
    </a>
  </div>
</body>
</html>
